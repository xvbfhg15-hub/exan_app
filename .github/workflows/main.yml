name: Build Flutter APK (Upgrade Gradle Wrapper)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Upgrade Gradle & Build APK
        run: |
          FLUTTER_PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$FLUTTER_PUBSPEC")
          cd "$PROJECT_DIR"

          # إعادة إنشاء إعدادات أندرويد لتحديث الملفات المتوافقة
          flutter create . --platforms=android --org com.example
          flutter pub get

          # تحديث رابط Gradle Wrapper في المجلد إلى إصدار 8.2 الحديث والمتوافق مع Java 17
          WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-all.zip|g' "$WRAPPER_PROP"
          fi

          # إجبار التجميع عبر Flutter
          flutter build apk --debug

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-debug-apk
          path: '**/*.apk'
