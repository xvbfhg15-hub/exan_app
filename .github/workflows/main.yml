name: Force Build and Upload APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Clean & Build APK
        run: |
          FLUTTER_PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$FLUTTER_PUBSPEC")
          cd "$PROJECT_DIR"

          rm -rf android
          flutter create . --platforms=android --org com.example
          flutter pub get
          
          # تجربة البناء العادي، وإن تعذر يتم التجميع بإجبار خيارات معالجة الأخطاء
          flutter build apk --debug --no-sound-null-safety || flutter build apk --debug || true

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-debug
          path: '**/build/app/outputs/flutter-apk/*.apk'
