name: Build Flutter APK (Stable Environment)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Android Project & Build
        run: |
          FLUTTER_PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$FLUTTER_PUBSPEC")
          cd "$PROJECT_DIR"

          # إعادة توليد أندرويد لضمان Android v2 Embedding
          flutter create . --platforms=android --org com.example

          # إجبار Gradle على استخدام Java 17 المتوفرة في البيئة
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-debug-apk
          path: '**/*.apk'
