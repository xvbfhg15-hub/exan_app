name: Build Flutter APK & Catch Error

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK and Catch Specific Error
        run: |
          FLUTTER_PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$FLUTTER_PUBSPEC")
          cd "$PROJECT_DIR"

          flutter create . --platforms=android --org com.example
          flutter pub get
          
          # تجديد ملف gradle.properties لمنع تعارضات ذاكرة جافا
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          
          # تشغيل التجميع وتوجيه أخطاء Gradle للطباعة المباشرة
          flutter build apk --debug --extra-front-end-options="--no-implicit-casts" || flutter build apk --debug --verbose

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-debug-apk
          path: '**/*.apk'
