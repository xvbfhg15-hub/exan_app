name: Build Web App to APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build --if-present

      - name: Setup Capacitor and Build Android APK
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          
          BUILD_DIR="dist"
          if [ ! -d "dist" ]; then BUILD_DIR="build"; fi
          if [ ! -d "$BUILD_DIR" ]; then mkdir -p "$BUILD_DIR"; fi
          
          npx cap init "MyApp" "com.example.myapp" --web-dir "$BUILD_DIR"
          npx cap add android
          
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
