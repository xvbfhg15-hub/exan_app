name: Auto Fix Android v2 Embedding and Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Patch Project to Android v2 Embedding & Build
        run: |
          FLUTTER_PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$FLUTTER_PUBSPEC")
          cd "$PROJECT_DIR"

          # 1. تحديث AndroidManifest.xml بإضافة meta-data للـ v2 embedding
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST_FILE"; then
              sed -i '/<\/application>/i \        <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST_FILE"
            fi
          fi

          # 2. تعديل ملفات Kotlin / Java للاعتماد على v2 Embedding تلقائياً
          find android/app/src/main -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' {} +

          # 3. جلب الحزم وبناء الـ APK
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: '**/*.apk'
